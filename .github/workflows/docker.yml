name: Build and publish Ghost (Resend)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22.18.0"
  HUSKY: "0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Ghost build version
        run: |
          PKG_VERSION=$(node -p "require('./ghost/core/package.json').version")
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "GHOST_BUILD_VERSION=${PKG_VERSION}+${SHORT_SHA}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Railway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.railway
          push: true
          tags: |
            ghcr.io/beyond925-gmbh/ghost:resend
            ghcr.io/beyond925-gmbh/ghost:sha-${{ github.sha }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            GHOST_BUILD_VERSION=${{ env.GHOST_BUILD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
